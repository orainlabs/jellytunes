packages:
  - .

overrides:
  # Electron 44 changed the v8::External::New signature (now requires a third
  # argument). nan < 2.28 calls the old 2-arg overload and fails to compile
  # usb-detection's native layer against it. nan 2.28.0 detects the new API
  # via V8_EXTERNAL_POINTER_TAG_COUNT and uses the 3-arg overload.
  nan: ^2.28.0

allowBuilds:
  '@ffmpeg-installer/darwin-x64': true
  electron: true
  esbuild: true
  sharp: true

ignoredBuiltDependencies:
  - drivelist
  # usb-detection 4.14.2 install hook falls back to node-gyp@10 which can't parse
  # Visual Studio 18 on the windows-2025-vs2026 runner. Native build is handled by
  # `electron-builder install-app-deps` (postinstall) which uses @electron/rebuild
  # + node-gyp@12 — verified locally on 2026-07-22.
  - usb-detection
  # better-sqlite3 13.0.3 dropped prebuild-install (only dep is node-addon-api) and
  # declares no install script, so pnpm falls back to `node-gyp rebuild` against its
  # binding.gyp — same node-gyp@11 that can't parse Visual Studio 18 on the
  # windows-2025-vs2026 runner. Native build is handled by
  # `electron-builder install-app-deps` (postinstall) which uses @electron/rebuild
  # + node-gyp@12, same precedent as usb-detection above.
  - better-sqlite3

onlyBuiltDependencies:
  - '@ffmpeg-installer/darwin-x64'
  - electron
  - esbuild
  - sharp
