name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v0.2.17)'
        required: true

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: mac
            arch: arm64
          - os: macos-latest
            platform: mac
            arch: x64
          - os: windows-latest
            platform: win
            arch: x64
          - os: ubuntu-latest
            platform: linux
            arch: x64

    runs-on: ${{ matrix.os }}

    env:
      # Repo secret, generated with:
      #   snapcraft export-login --channels=beta,candidate,stable -
      # The credential is channel-scoped and expires (1 year by default), so a
      # release that suddenly stops publishing is usually this. Registration of
      # the snap name and this secret are tracked in ORAIN-0581. Left unset, the
      # "Publish snap to the Snap Store" step below fails the release rather
      # than skipping silently: a green release that published nothing is worse
      # than a red one.
      SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}

    steps:
      - uses: actions/checkout@900f2210b1d28bbbd0bd22d17926b9e224e8f231

      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093
        with:
          version: 10

      - uses: actions/setup-node@0355742c943ddb13ca8a6b700f824231caa91e75
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Setup Python
        if: matrix.os == 'macos-latest' || matrix.os == 'windows-latest'
        uses: actions/setup-python@c8813ba1bc76ebf779b911ad8ffccbf2e449cb48
        with:
          python-version: '3.11'

      - name: Install system dependencies (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update && sudo apt-get install -y libudev-dev
          sudo snap wait system seed.loaded
          sudo snap install snapcraft --classic
          sudo snap install lxd
          sudo lxd init --auto
          sudo usermod -a -G lxd "$USER"
          # GitHub Actions runners ship Docker, which sets the DOCKER-USER
          # iptables chain to DROP forwarded traffic by default. That blocks
          # the lxdbr0 bridge `lxd init --auto` just created, so the managed
          # snapcraft build instance can't reach the network to fetch its
          # base image or packages ("A network related operation failed in a
          # context of no network access"). Explicitly allow lxdbr0 traffic
          # through: https://github.com/canonical/craft-providers/issues/172
          sudo iptables -I DOCKER-USER -i lxdbr0 -j ACCEPT
          sudo iptables -I DOCKER-USER -o lxdbr0 -j ACCEPT

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          npm_config_arch: ${{ matrix.arch }}

      - name: Build and package
        shell: bash
        run: |
          if [ "${{ matrix.platform }}" = "linux" ]; then
            # `usermod -a -G lxd` above doesn't take effect in the current shell
            # session — `sg lxd` runs the build with that group active without
            # needing a fresh login.
            sg lxd -c "pnpm run build && pnpm exec electron-builder --linux --${{ matrix.arch }} --publish never"
          else
            pnpm run build && pnpm exec electron-builder --${{ matrix.platform }} --${{ matrix.arch }} --publish never
          fi
        env:
          npm_config_arch: ${{ matrix.arch }}

      # Publishes to `beta`, not `stable`. Strict confinement has a failure mode
      # no build-time check covers: the snap builds green and still fails at
      # launch (ORAIN-0580, missing libnss3) or hits AppArmor denials at runtime
      # (ORAIN-0571, blocked `df` and /proc/mounts). Promotion to `stable` is a
      # human gate until CI runs a runtime smoke test on the built snap
      # (ORAIN-0582), after which this can release straight to `stable`:
      #   snapcraft release jellytunes <rev> stable
      - name: Publish snap to the Snap Store
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          if [ -z "$SNAPCRAFT_STORE_CREDENTIALS" ]; then
            echo "::error::SNAPCRAFT_STORE_CREDENTIALS is not configured, so the snap cannot be published. Set the repo secret with the output of 'snapcraft export-login --channels=beta,candidate,stable -' (the credential is channel-scoped and expires)."
            exit 1
          fi
          snapcraft upload --release=beta release/*.snap

      # Handed off to the `publish-release` job below rather than attached to
      # the GitHub Release directly from here. With `fail-fast: false`, a
      # failure on one platform must not let the other three still publish
      # their assets straight to the release — that's a partial release that
      # looks green at the tag level (ORAIN-0583).
      - name: Upload build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: jellytunes-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            release/*.dmg
            release/*.exe
            release/*.AppImage
            release/*.deb
            release/*.snap
          if-no-files-found: ignore
          retention-days: 1

  publish-release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@900f2210b1d28bbbd0bd22d17926b9e224e8f231

      - name: Download all build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: release
          pattern: jellytunes-*
          merge-multiple: true

      # Defense in depth against a leg that reports success but silently
      # produced nothing (glob mismatch, electron-builder skipping a target,
      # etc.) — `needs: build` alone only guards against a leg that reports
      # failure.
      - name: Verify all expected release artifacts are present
        shell: bash
        run: |
          missing=()
          for ext in dmg exe AppImage deb; do
            if ! compgen -G "release/*.${ext}" > /dev/null; then
              missing+=("*.${ext}")
            fi
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing expected release artifact(s): ${missing[*]}. Refusing to publish a partial release."
            ls -la release/ || true
            exit 1
          fi
          echo "All expected artifacts present:"
          ls -la release/

      # The .snap is intentionally not attached here. Snaps are distributed
      # through the Snap Store (published above), not as a standalone
      # download — a .snap grabbed from a GitHub Release has no store
      # assertion, so `snap install` refuses it unless you pass --dangerous,
      # which also weakens confinement. See RELEASE_NOTES.md for the
      # `snap install` instructions we point Linux/Snap users to instead.
      - name: Upload artifacts to release
        uses: softprops/action-gh-release@3efcac8951299998593f871640ea8059d6818655
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          body_path: RELEASE_NOTES.md
          files: |
            release/*.dmg
            release/*.exe
            release/*.AppImage
            release/*.deb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
