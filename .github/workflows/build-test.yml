name: Build Test

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # Builds the Snap via LXD on Ubuntu. The slowest green Linux leg on
    # record (run 34597779199, 2026-09-11) was 88m 30s, dominated by
    # `Fetching stage-packages` on a slow Ubuntu mirror. 180 min cuts real
    # hangs (was 6h before) while leaving 2× headroom on a healthy run. See
    # ORAIN-0698.
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: mac
            arch: arm64
          - os: macos-latest
            platform: mac
            arch: x64
          - os: windows-latest
            platform: win
            arch: x64
          - os: ubuntu-latest
            platform: linux
            arch: x64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@900f2210b1d28bbbd0bd22d17926b9e224e8f231

      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093
        with:
          version: 10

      - uses: actions/setup-node@0355742c943ddb13ca8a6b700f824231caa91e75
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Setup Python
        if: matrix.os == 'macos-latest' || matrix.os == 'windows-latest'
        uses: actions/setup-python@c8813ba1bc76ebf779b911ad8ffccbf2e449cb48
        with:
          python-version: '3.11'

      - name: Install system dependencies (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update && sudo apt-get install -y libudev-dev
          sudo snap wait system seed.loaded
          # Pin snapcraft to a known-good version. Without this, `snap install
          # snapcraft --classic` always pulls latest/stable and a fresh release
          # of snapcraft can break the build. ORAIN-0741: snapcraft 9.x breaks
          # electron-builder 26.16.1 in two distinct ways:
          #   - 9.1.x changed mediated GUI asset resolution, so
          #     `desktop: meta/gui/jellytunes.desktop` fails with
          #     `ERR_ELECTRON_BUILDER_CANNOT_EXECUTE: file does not exist`.
          #   - 9.0.x (rev 18514, the version that shipped before the bump)
          #     fails the same way on Ubuntu 26 / GitHub Actions runners:
          #     `Failed to pull source: 'app' not found` because the LXD
          #     bind-mount idmap inside the managed instance can't see the
          #     bind-mounted project tree. Reproduced in the Ubuntu 26 dev VM
          #     on 2026-09-28 with `snapcraft found version=snapcraft 9.0.1`
          #     then `Failed to pull source: 'app' not found.` /
          #     `ERR_ELECTRON_BUILDER_CANNOT_EXECUTE`.
          #
          # Strategy: prefer the upstream-pinned revision; if the store no
          # longer serves that revision on any channel, fall back to the
          # closest stable channel. At 2026-09-28 the Snap Store no longer
          # exposes snapcraft 9.0.1 (rev 18514) on any channel — `snap install
          # --revision=18514` is rejected with `ERR_REVISION_NOT_FOUND`. So
          # we install from `8.x/stable` (serves 8.14.5, rev 17614 on amd64),
          # which is the last known working version. The pin is reviewed out
          # in a follow-up task once electron-builder / snapcraft ship a
          # compatible pair again.
          sudo snap install snapcraft --classic --channel=8.x/stable
          sudo snap install lxd
          sudo lxd init --auto
          sudo usermod -a -G lxd "$USER"
          # GitHub Actions runners ship Docker, which sets the DOCKER-USER
          # iptables chain to DROP forwarded traffic by default. That blocks
          # the lxdbr0 bridge `lxd init --auto` just created, so the managed
          # snapcraft build instance can't reach the network to fetch its
          # base image or packages ("A network related operation failed in a
          # context of no network access"). Explicitly allow lxdbr0 traffic
          # through: https://github.com/canonical/craft-providers/issues/172
          sudo iptables -I DOCKER-USER -i lxdbr0 -j ACCEPT
          sudo iptables -I DOCKER-USER -o lxdbr0 -j ACCEPT
          # ORAIN-0741 AC2: surface the pinned snapcraft version in the job
          # log so a future regression can be diagnosed without re-running
          # the build. `snap list snapcraft` prints the installed channel
          # and revision; `snapcraft --version` only prints the version.
          echo "snapcraft version: $(snapcraft --version) (channel=$(snap list snapcraft | awk 'NR==2 {print $4}'), revision=$(snap list snapcraft | awk 'NR==2 {print $3}'))"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          npm_config_arch: ${{ matrix.arch }}

      - name: Run lint
        run: pnpm lint

      - name: Set dev version
        shell: bash
        run: echo "DEV_VERSION=$(node -p "require('./package.json').version")-dev.$(git rev-parse --short HEAD)" >> $GITHUB_ENV

      - name: Build and package
        shell: bash
        run: |
          if [ "${{ matrix.platform }}" = "linux" ]; then
            # `usermod -a -G lxd` above doesn't take effect in the current shell
            # session — `sg lxd` runs the build with that group active without
            # needing a fresh login.
            sg lxd -c "pnpm run build && pnpm exec electron-builder --linux --${{ matrix.arch }} --publish never"
          else
            pnpm run build && pnpm exec electron-builder --${{ matrix.platform }} --${{ matrix.arch }} --publish never
          fi
        env:
          npm_config_arch: ${{ matrix.arch }}
          npm_config_app_version: ${{ env.DEV_VERSION }}
          # electron-builder spawns snapcraft with its stdout/stderr on a pipe
          # that is only flushed if the process fails, so a slow Snap build is
          # indistinguishable from a hung job: the step emits nothing at all
          # between "executing snapcraft" and whatever ends it. That is what
          # made runs 34575486832 and 34578845971 unreadable — both were
          # cancelled by hand after 26 and 18 minutes of silence.
          #
          # Enabling electron-builder's debug namespace flips that stdio to
          # "inherit" (builder-util/out/util.js), so snapcraft streams straight
          # into the job log, and makes electron-builder pass --verbose to
          # snapcraft on top. Linux only: the other platforms don't run
          # snapcraft and the extra output just makes their logs harder to read.
          DEBUG: ${{ matrix.platform == 'linux' && 'electron-builder' || '' }}

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: jellytunes-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            release/*.dmg
            release/*.exe
            release/*.AppImage
            release/*.deb
            release/*.snap
          retention-days: 7
